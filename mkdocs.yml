site_name: Orquestrador de Coleta TJSP / e-SAJ
site_description: >-
  Coleta de processos judiciais do TJSP pelo portal e-SAJ e montagem de um
  Data Lake em JSONL. Documentação em formato ADR.
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Alternar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Alternar para o modo claro

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.smartsymbols

# Com `mkdocs build --strict`, estes avisos viram erro.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# O nav espelha a árvore de docs/, que por sua vez espelha src/ e scripts/.
nav:
  - Início: index.md

  - Guias:
      - Configuração do ambiente: guias/configuracao_ambiente.md
      - Padrão de logging: guias/logging_padrao.md

  - Módulos (src):
      - Template de ADR de módulo: src/template_src.md
      - Vocabulário de status: src/status.md
      - scrapers:
          - Exceções de domínio: src/scrapers/exceptions.md
          - Número Único CNJ: src/scrapers/numero_processo.md
          - Cliente HTTP do e-SAJ: src/scrapers/esaj_client.md
          - Estado da página e identidade: src/scrapers/page_state.md
          - Parser base da capa: src/scrapers/parser_base.md
          - Parser de 1º grau: src/scrapers/parser_primeiro_grau.md
          - Parser de 2º grau: src/scrapers/parser_segundo_grau.md
          - Coleta de um processo: src/scrapers/coletor.md
      - store:
          - Checkpoint em SQLite: src/store/sqlite_store.md
      - transformers:
          - Limpeza e normalização: src/transformers/limpeza.md
          - Derivação do vínculo: src/transformers/vinculo.md
          - Projeção do documento final: src/transformers/projecao.md
      - aggregators:
          - Export da base final: src/aggregators/exportador.md

  - Scripts:
      - Template de ADR de script: scripts/template_script.md
      - Orquestrador interativo (menu): scripts/menu.md
      - Spike de seletores: scripts/spike_seletores.md

  - Notebooks:
      - Template de ADR de notebook: notebooks/template_notebook.md

  - Backlog técnico: backlog.md
